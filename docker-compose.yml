services:
  mysql:
    image: mysql:8.4
    container_name: scrapyhub-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-scrapyhub}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hot_list}
      MYSQL_USER: ${MYSQL_USER:-scrapyhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scrapyhub}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
