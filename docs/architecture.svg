<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
  <style>text{font-family:Arial,sans-serif;fill:#172033} .title{font-size:26px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:14px}.box{stroke:#345;stroke-width:2;rx:14}.arrow{stroke:#607089;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607089"/></marker></defs>
  <rect width="1100" height="500" fill="#f7f9fc"/>
  <text x="550" y="42" text-anchor="middle" class="title">ScrapyHub data pipeline</text>
  <rect x="45" y="105" width="190" height="250" fill="#e8f1ff" class="box"/>
  <text x="140" y="140" text-anchor="middle" class="label">Supported sites</text>
  <text x="70" y="178" class="small">Weibo · Zhihu · Baidu</text><text x="70" y="207" class="small">Douyin · Toutiao</text><text x="70" y="236" class="small">Bilibili · Juejin</text><text x="70" y="265" class="small">36Kr · WallstreetCN</text><text x="70" y="294" class="small">The Paper</text>
  <rect x="310" y="105" width="205" height="250" fill="#e9fbf1" class="box"/>
  <text x="412" y="140" text-anchor="middle" class="label">Scrapy spiders</text><text x="337" y="185" class="small">HTTP / JSON parsing</text><text x="337" y="214" class="small">RankingItem contract</text><text x="337" y="243" class="small">robots.txt + delay</text><text x="337" y="272" class="small">one spider per site</text>
  <rect x="590" y="105" width="205" height="250" fill="#fff5df" class="box"/>
  <text x="692" y="140" text-anchor="middle" class="label">Validation + pipeline</text><text x="617" y="185" class="small">normalize fields</text><text x="617" y="214" class="small">3-day de-duplication</text><text x="617" y="243" class="small">DB connection pool</text><text x="617" y="272" class="small">batch timestamp</text>
  <rect x="870" y="105" width="185" height="250" fill="#f3eaff" class="box"/>
  <text x="962" y="140" text-anchor="middle" class="label">MySQL</text><text x="900" y="190" class="small">ranking table</text><text x="900" y="219" class="small">indexes</text><text x="900" y="248" class="small">analytics queries</text><text x="900" y="277" class="small">Docker volume</text>
  <path d="M235 230 H305" class="arrow"/><path d="M515 230 H585" class="arrow"/><path d="M795 230 H865" class="arrow"/>
  <text x="550" y="425" text-anchor="middle" class="small">run_all.py orchestrates spiders · Docker Compose supplies a reproducible MySQL service</text>
</svg>
